<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Блокнот официанта</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Блокнот">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<style>
/* Layout: список столов и заказ карточками на сером фоне, как в системных приложениях iPhone. Внизу стола постоянная панель меню: поиск, цех, категория, блюдо. */
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#E9E9EF;
  --fg:#000000;
  --muted:#6C6C70;
  --line:#DCDCE0;
  --accent:#007AFF;
  --accent-fg:#FFFFFF;
  --accent-soft:#E5F1FF;
  --ok:#1F8A3B;
  --ok-soft:#E2F6E8;
  --on-ok:#FFFFFF;
  --warn:#B86200;
  --warn-soft:#FFF0D9;
  --late:#D70015;
  --late-soft:#FFE4E6;
  --on-late:#FFFFFF;
  --zb:#0A7AA1;
  --zb-soft:#DDF3FA;
  --zd:#8944AB;
  --zd-soft:#F1E6F8;
  --shadow:0 -6px 28px rgba(0,0,0,.16);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--fg:#FFFFFF;--muted:#9A9AA0;--line:#38383A;
    --accent:#0A84FF;--accent-fg:#FFFFFF;--accent-soft:#0E2A47;
    --ok:#30D158;--ok-soft:#10301A;--on-ok:#04200C;
    --warn:#FF9F0A;--warn-soft:#3A2A09;--late:#FF453A;--late-soft:#3F1613;--on-late:#FFFFFF;
    --zb:#64D2FF;--zb-soft:#0E2F3D;--zd:#BF5AF2;--zd-soft:#2B1838;
    --shadow:0 -6px 28px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#1C1C1E;--surface-2:#2C2C2E;--fg:#FFFFFF;--muted:#9A9AA0;--line:#38383A;
  --accent:#0A84FF;--accent-fg:#FFFFFF;--accent-soft:#0E2A47;
  --ok:#30D158;--ok-soft:#10301A;--on-ok:#04200C;
  --warn:#FF9F0A;--warn-soft:#3A2A09;--late:#FF453A;--late-soft:#3F1613;--on-late:#FFFFFF;
  --zb:#64D2FF;--zb-soft:#0E2F3D;--zd:#BF5AF2;--zd-soft:#2B1838;
  --shadow:0 -6px 28px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font:17px/1.35 var(--f-body);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
input{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:600px;margin:0 auto;padding-bottom:40px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px 8px}
.ttl{flex:1;min-width:0}
.lt{margin:0;font:700 32px/1.1 var(--f-body);letter-spacing:-.01em}
.nt{margin:0;font:700 22px/1.15 var(--f-body);display:flex;align-items:baseline;gap:6px;min-width:0}
.h1s{color:var(--muted);font-weight:500;font-size:17px}
.h1n{font:700 30px/1 var(--f-num);overflow-wrap:anywhere}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--fg);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;box-shadow:0 0 0 1px var(--line) inset}
.icon svg{width:22px;height:22px}
.icon[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* смахивание */
.sw{position:relative;overflow:hidden;border-radius:14px}
.sw-del{position:absolute;top:0;right:0;bottom:0;width:96px;border:0;background:var(--late);color:var(--on-late);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px/1 var(--f-body);cursor:pointer;visibility:hidden}
.sw-del svg{width:22px;height:22px}
.sw-cm{position:absolute;top:0;left:0;bottom:0;width:96px;border:0;background:var(--accent);color:var(--accent-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 12px/1 var(--f-body);cursor:pointer;visibility:hidden}
.sw-cm svg{width:22px;height:22px}
.sw.open .sw-del,.sw.drag .sw-del,.sw.drag .sw-cm{visibility:visible}
.sw-fg{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .2s ease;will-change:transform}

/* зал */
.rows{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rowc{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--surface);border:0;border-radius:14px;text-align:left;cursor:pointer;min-width:0;box-shadow:0 0 0 1px var(--line) inset}
.rowc.free{background:transparent;color:var(--muted);min-height:64px}
.rowc.free svg{width:22px;height:22px;flex:none;color:var(--accent)}
.rnum{font:700 40px/1 var(--f-num);min-width:2ch;text-align:center;flex:none}
.rmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rtop{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rstat{display:flex;align-items:center;gap:8px;min-width:0}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font:500 13px/1.3 var(--f-body);background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.pill.live{font:600 18px/1.15 var(--f-num);letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft)}
.pill.live[data-state="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill.live[data-state="late"]{background:var(--late-soft);color:var(--late)}
.lbl{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.segs{display:flex;gap:3px;flex-wrap:wrap}
.sg{display:block;width:14px;height:6px;border-radius:3px;background:var(--surface-2)}
.sg.served{background:var(--ok)}
.sg.kitchen{background:var(--accent)}
.sg.kitchen[data-state="warn"]{background:var(--warn)}
.sg.kitchen[data-state="late"]{background:var(--late)}
.hintline{margin:18px 0 0;text-align:center;font-size:13px;color:var(--muted)}

/* цеха */
.zone{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;vertical-align:2px;background:var(--surface-2);color:var(--muted)}
.zone.z-bar{background:var(--zb-soft);color:var(--zb)}
.zone.z-dessert{background:var(--zd-soft);color:var(--zd)}
.zdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--muted);vertical-align:1px}
.zdot.z-bar{background:var(--zb)}
.zdot.z-dessert{background:var(--zd)}

/* заказ */
.tnote{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:14px;overflow-wrap:anywhere}
.group{margin-top:18px}
.group.g{margin-top:10px}
.gh{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;margin:0 0 8px;padding:0 12px;border:0;border-radius:12px;background:transparent;box-shadow:0 0 0 1px var(--line) inset;text-align:left;font:inherit;color:inherit;cursor:pointer}
.gh .gn{font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gh .gc{font-size:13px;color:var(--muted)}
.gh .gadd{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent)}
.gh.on{box-shadow:0 0 0 2px var(--accent) inset}
.gh.on .gn{color:var(--accent)}
.cbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.cp{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line) inset;font-size:13px}
.cp b{font-weight:700}.cp i{font-style:normal;color:var(--muted)}
.cp .btn.small{min-height:30px;padding:0 12px;font-size:13px}
.cp.nob{padding-right:12px}
.imod{display:block;margin-top:2px;font-size:14px;font-weight:500;color:var(--accent);overflow-wrap:anywhere}
.chips.pk .chip{min-height:48px;padding:0 18px;font-size:16px}
.chips.tp .chip{min-height:40px;font-size:14px}
.fld .lbl2{display:block;margin:14px 0 2px}
.group .sw{margin-bottom:8px;scroll-margin-bottom:calc(var(--mph,100px) + 12px)}
.ghead{display:flex;align-items:center;gap:10px;margin:0 4px 8px;min-height:34px}
.ghead h2{margin:0;font:600 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gcount{font-size:13px;color:var(--muted);flex:1;min-width:0}
.item{display:flex;align-items:stretch;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line) inset}
.item[data-st="served"]{background:transparent}
.item[data-st="served"] .iname{color:var(--muted)}
.ibody{flex:1;min-width:0;text-align:left;padding:12px 8px 12px 14px;cursor:pointer;display:block}
.iname{display:block;font-weight:600;font-size:17px;overflow-wrap:anywhere}
.qty{font:700 20px/1 var(--f-num);color:var(--accent);margin-right:4px}
.seat{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:500;vertical-align:2px}
.inote{display:block;color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.istat{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.cchip{display:inline-flex;align-items:center;gap:2px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--surface-2);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer}
.cchip svg{width:14px;height:14px;color:var(--muted)}
.cchip.fixed{padding:3px 10px;color:var(--muted);cursor:default;font-weight:500}
.tm{font:600 24px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--accent)}
.tm[data-state="warn"]{color:var(--warn)}
.tm[data-state="late"]{color:var(--late)}
.st.ok{color:var(--ok);font-weight:600}
.st.wait{color:var(--warn);font-weight:600}
.prog{display:block;height:4px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
.prog i[data-state="warn"]{background:var(--warn)}
.prog i[data-state="late"]{background:var(--late)}
.act{flex:none;width:88px;border:0;border-left:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font:600 13px/1.2 var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:8px;border-radius:0 14px 14px 0}
.act svg{width:22px;height:22px}
.act.done{background:var(--ok);color:var(--on-ok);border-left-color:transparent}
.act.undo{width:60px;background:transparent;color:var(--muted)}
.act.later{background:transparent;color:var(--muted)}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
.sw.flash .item{animation:flash .9s ease-out}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--surface-2);font:600 17px/1 var(--f-body);cursor:pointer}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);color:var(--on-ok)}
.btn.danger{color:var(--late);background:var(--late-soft)}
.btn.wide{width:100%}
.btn.small{min-height:34px;padding:0 14px;font-size:14px;border-radius:999px}
.textbtn{display:block;margin:20px auto 0;background:none;border:0;color:var(--accent);font:500 16px/1 var(--f-body);padding:12px;cursor:pointer}
.empty{margin-top:28px;padding:24px;border-radius:16px;text-align:center;color:var(--muted);background:var(--surface);box-shadow:0 0 0 1px var(--line) inset}
.empty h2{margin:0 0 6px;color:var(--fg);font:600 18px/1.3 var(--f-body)}
.empty p{margin:0}

/* закрытые */
.cl{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line) inset}
.cl-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cl-h b{font:700 28px/1 var(--f-num)}
.cl-h span{color:var(--muted);font-size:14px}
.cl-items{margin:8px 0 12px;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}

/* панель меню */
.mp{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:6;max-width:640px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:0;padding:8px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.kb .mp{padding-bottom:8px}
.mp-bar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 10px;min-height:44px;color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--accent)}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font-size:17px;outline:none;padding:10px 0}
.search input::placeholder{color:var(--muted)}
.sclear{border:0;background:none;padding:4px;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sclear svg{width:20px;height:20px}
.mp-t{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mp-t svg{width:20px;height:20px}
.mp-body{display:none}
.mp.open{display:flex;flex-direction:column;height:min(38vh,calc(var(--vvh,100vh) - 110px));height:min(38dvh,calc(var(--vvh,100dvh) - 110px));min-height:250px}
.mp.open .mp-body{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:8px}
.mp-c{flex:none;min-height:44px;padding:0 8px 0 12px;border-radius:12px;border:0;background:var(--surface-2);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:2px;cursor:pointer;white-space:nowrap}
.mp-c svg{width:16px;height:16px;color:var(--muted)}
.mp-t.icononly{padding:0;width:44px;justify-content:center}
.mp-course{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:8px;flex:none}
.mp-course .l2{font-size:13px;color:var(--muted);margin-right:2px;flex:none}
.mp-course .chip{min-height:34px;padding:0 12px;font-size:14px}
#mp-nav{flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px;margin-bottom:6px}
.seg button{flex:1;min-height:30px;border:0;background:none;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.back{display:flex;align-items:center;gap:2px;min-height:36px;border:0;background:none;color:var(--accent);font-weight:600;font-size:16px;padding:0 0 4px;cursor:pointer;text-align:left}
.back svg{width:20px;height:20px;flex:none}
.mp-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding-bottom:6px}
.cat{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;min-height:52px;padding:8px 12px;border-radius:12px;border:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:15px;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.cat small{color:var(--muted);font-weight:500;font-size:13px}
.dish{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dn{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.dm{font-size:13px;color:var(--muted)}
.dq{font:700 16px/1 var(--f-num);color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:999px;flex:none}
.dplus{color:var(--accent);flex:none;display:grid}
.dplus svg{width:24px;height:24px}
.none{padding:20px 4px;color:var(--muted);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-bottom:6px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:60px;padding:8px 6px 7px 11px;border:0;border-radius:12px;background:var(--surface-2);text-align:left;cursor:pointer;overflow:hidden;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
.tile.z-bar::before{background:var(--zb)}
.tile.z-dessert::before{background:var(--zd)}
.tile:active{background:var(--accent-soft)}
.tn{font-weight:600;font-size:12.5px;line-height:1.2;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.tile:has(.tq) .tn{padding-right:18px}
.tm2{font-size:10.5px;color:var(--muted)}
.tq{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:700 13px/22px var(--f-num);text-align:center}

/* нижняя панель-лист */
#sheet[hidden]{display:none}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font:600 20px/1.2 var(--f-body);min-width:0;overflow-wrap:anywhere}
.fld{display:block;margin-top:14px;min-width:0}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
input[type="text"]{width:100%;min-height:50px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);padding:0 14px;font-size:17px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--surface-2);border-radius:14px;padding:3px}
.step .icon{border-radius:11px;background:var(--surface);width:42px;height:42px;box-shadow:none}
.step output{font:700 26px/1 var(--f-num);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}

      const d=S.dishes[dishKey(i.name)];
      i.zone=d&&d.zone?d.zone:(i.zone||'kitchen');
    });
  });
  const isSlot=t=>/^\d+$/.test(t.name)&&+t.name>=1&&+t.name<=HALL;
  const taken=new Set(S.tables.filter(t=>!t.closedAt&&isSlot(t)).map(t=>+t.name));
  S.tables.filter(t=>!t.closedAt&&!isSlot(t)).forEach(t=>{
    let n=1;while(n<=HALL&&taken.has(n))n++;
    if(n<=HALL){t.name=String(n);taken.add(n);}else t.closedAt=Date.now();
  });
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
save();

const getTable=id=>S.tables.find(t=>t.id===id);
const slotTable=n=>S.tables.find(t=>!t.closedAt&&t.name===String(n));
const counts=t=>{const c={new:0,kitchen:0,served:0};t.items.forEach(i=>{c[i.status]++;});return c;};
const qtyIn=(t,name)=>t.items.filter(i=>i.name===name).reduce((s,i)=>s+i.qty,0);

/* ---------- курсы по цехам ---------- */
const courseList=t=>Array.from(new Set(t.items.map(i=>i.course))).sort((a,b)=>a-b);
function prevCourse(t,c){const l=courseList(t);const k=l.indexOf(c);return k>0?l[k-1]:null;}
/* курс, который это блюдо ждёт: предыдущий курс того же цеха ещё не вынесен */
function waitingOn(t,i){
  const p=prevCourse(t,i.course);
  if(p==null)return null;
  const prev=t.items.filter(x=>x.course===p&&x.zone===i.zone);
  return prev.length&&prev.some(x=>x.status!=='served')?p:null;
}
/* цех вынес весь свой курс: его следующий курс уходит на готовку сам. Другие цеха не трогаем. */
function chainAfter(t,course,zone,now){
  const l=courseList(t);const k=l.indexOf(course);
  if(k<0||k>=l.length-1)return null;
  const cur=t.items.filter(i=>i.course===course&&i.zone===zone);
  if(!cur.length||cur.some(i=>i.status!=='served'))return null;
  const nxt=t.items.filter(i=>i.course===l[k+1]&&i.zone===zone&&i.status==='new');
  if(!nxt.length)return null;
  nxt.forEach(i=>sendToKitchen(i,now));
  return {course:l[k+1],zone,n:nxt.length};
}
/* гости: заказ разбит по гостям, как в iiko Waiter */
function seatMax(t){let m=t.guests;t.items.forEach(i=>{if(i.seat>m)m=i.seat;});return m;}
function activeSeat(t){const s=typeof t.seat==='number'?t.seat:1;return s===0?0:Math.min(s,seatMax(t));}
function chainToast(res){
  const list=res.filter(Boolean);
  if(!list.length)return;
  try{if(navigator.vibrate)navigator.vibrate([60,60,60]);}catch(e){}
  toast(list.map(r=>'Курс '+r.course+' · '+ZN[r.zone]+': ушло на готовку '+r.n).join(' · '),3500);
}

/* ---------- время ---------- */
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return h>0?h+':'+pad(m)+':'+pad(ss):pad(m)+':'+pad(ss);}
function fmtSeated(ms){const min=Math.max(0,Math.floor(ms/60000));return min<60?min+' мин':Math.floor(min/60)+' ч '+pad(min%60)+' мин';}
function fmtDur(ms){const m=Math.round(ms/60000);return m<1?'меньше минуты':m+' мин';}
function fmtHM(ts){try{return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

/* ---------- зал ---------- */
function statHTML(t){
  const c=counts(t),total=t.items.length;
  const kit=t.items.filter(i=>i.status==='kitchen').sort((a,b)=>(a.sentAt+a.cook*60000)-(b.sentAt+b.cook*60000));

  if(c.new)return '<span class="pill">Не отправлено: '+c.new+'</span>';
  return '<span class="pill ok">Всё вынесено</span>';
}
function rowHTML(t){

    +'<span class="rstat">'+statHTML(t)+'</span><span class="segs">'+segs+'</span></span></div></div>';
}

/* ---------- стол ---------- */
function tsubHTML(t){

  return t.guests+' '+plural(t.guests,P_GUEST)+' · за столом <span data-seated="'+t.openedAt+'"></span>'+(k?' · на готовке '+k:'');

function guestSection(t,s,label,act){
  const items=t.items.filter(i=>i.seat===s).sort((a,b)=>(a.course-b.course)||(RANK[a.status]-RANK[b.status])||(ZORD[a.zone]-ZORD[b.zone]));
  const on=act===s;
  return '<section class="group g"><button type="button" class="gh'+(on?' on':'')+'" data-act="set-seat" data-s="'+s+'" aria-pressed="'+on+'">'
    +'<span class="gn">'+label+'</span>'+(items.length?'<span class="gc">'+items.length+' '+plural(items.length,P_DISH)+'</span>':'')
    +(on?'<span class="gadd">Добавляется сюда</span>':'')+'</button>'
    +items.map(i=>itemHTML(t,i)).join('')+'</section>';

function orderHTML(t){
  const note=t.note?'<p class="tnote">'+esc(t.note)+'</p>':'';
  const act=activeSeat(t);
  let cb='';
  if(t.items.length){
    courseList(t).forEach(course=>{
      const items=t.items.filter(i=>i.course===course);
      const n=items.filter(i=>i.status==='new').length,k=items.filter(i=>i.status==='kitchen').length,s=items.filter(i=>i.status==='served').length;
      let btn='';
      if(n)btn='<button class="btn small" data-act="course-send" data-course="'+course+'">Отправить · '+n+'</button>';
      else if(k)btn='<button class="btn small ok" data-act="course-serve" data-course="'+course+'">Вынесено · '+k+'</button>';
      cb+='<span class="cp'+(btn?'':' nob')+'"><b>Курс '+course+'</b><i>'+s+'/'+items.length+'</i>'+btn+'</span>';
    });
    cb='<div class="cbar">'+cb+'</div>';
  }
  let g='';
  const m=seatMax(t);
  for(let s=1;s<=m;s++)g+=guestSection(t,s,'Гость '+s,act);
  if(t.guests>1||t.items.some(i=>i.seat===0))g+=guestSection(t,0,'На всех',act);
  return note+cb+g+'<p class="hintline">'+(t.items.length?'Вправо: комментарий. Влево: удалить.':'Выберите гостя и нажмите на блюдо в меню внизу.')+'</p>';
}
function itemHTML(t,i){
  const qty=i.qty>1?'<span class="qty">'+i.qty+'×</span>':'';
  const zone='<span class="zone z-'+i.zone+'">'+ZN[i.zone]+'</span>';
  const note=i.note?'<span class="inote">'+esc(i.note)+'</span>':'';

    ?'<span class="cchip" data-act="pick-course" data-id="'+i.id+'" role="button" tabindex="0">Курс '+i.course+ICON.chevd+'</span>'
    :'<span class="cchip fixed">Курс '+i.course+'</span>';
  let stat='',prog='',btn='';
  if(i.status==='new'){
    const w=waitingOn(t,i);
    if(w!=null){
      stat=chip+'<span class="st wait">Ждёт курс '+w+', стартует сам</span>';
      btn='<button class="act later" data-act="advance" data-id="'+i.id+'" aria-label="Отправить раньше">'+ICON.send+'<span>Раньше</span></button>';
    }else{
      stat=chip+'<span>'+cookFor(i.name)+' мин</span>';
      btn='<button class="act" data-act="advance" data-id="'+i.id+'">'+ICON.send+'<span>Отправить</span></button>';
    }
  }else if(i.status==='kitchen'){
    stat=chip+'<span class="tm" data-since="'+i.sentAt+'" data-target="'+i.cook+'">00:00</span><span>из '+i.cook+' мин</span>';
    prog='<span class="prog"><i data-since="'+i.sentAt+'" data-target="'+i.cook+'" data-fmt="bar"></i></span>';
    btn='<button class="act done" data-act="advance" data-id="'+i.id+'">'+ICON.check+'<span>Вынесено</span></button>';
  }else{
    stat=chip+'<span class="st ok">Вынесено</span>'+(i.sentAt&&i.servedAt?'<span>готовка '+fmtDur(i.servedAt-i.sentAt)+'</span>':'');
    btn='<button class="act undo" data-act="advance" data-id="'+i.id+'" aria-label="Вернуть назад">'+ICON.undo+'</button>';

    +'<div class="item sw-fg" data-st="'+i.status+'"><div class="ibody" data-act="edit-item" data-id="'+i.id+'" role="button" tabindex="0">'
    +'<span class="iname">'+qty+esc(i.name)+zone+'</span>'+modsHTML(i)+note+'<span class="istat">'+stat+'</span>'+prog+'</div>'+btn+'</div></div>';
}

function seatSheet(){
  let chips='';
  for(let g=1;g<=12;g++)chips+='<button type="button" class="chip" data-act="open-slot" data-n="'+sheet.slot+'" data-g="'+g+'">'+g+'</button>';
  return '<div class="sheet-h"><h2>Стол '+sheet.slot+': сколько гостей?</h2>'+closeBtn+'</div>'
    +'<div class="chips big">'+chips+'</div>'
    +'<p class="hint">Нажмите на число, и стол откроется. Гостей можно поменять позже.</p>';
}
function tableSheet(){
  const t=getTable(sheet.id);
  const unserved=t.items.filter(i=>i.status!=='served').length;
  const free=[];
  for(let n=1;n<=HALL;n++)if(String(n)!==t.name&&!slotTable(n))free.push(n);
  let h='<div class="sheet-h"><h2>Стол '+esc(t.name)+'</h2>'+closeBtn+'</div>'
    +'<div class="fld"><span>Гостей</span>'+stepper('guests',sheet.guests)+'</div>'
    +'<label class="fld"><span>Заметка к столу</span><input id="f-tnote" type="text" autocomplete="off" maxlength="120" value="'+esc(sheet.note)+'" placeholder="Аллергия на орехи, день рождения"></label>'
    +'<div class="fld"><span>Пересадить на стол</span><div class="chips">'
    +(free.length?free.map(n=>'<button type="button" class="chip" data-act="move-table" data-n="'+n+'">'+n+'</button>').join(''):'<span class="hint">Свободных столов нет</span>')
    +'</div></div>'
    +'<div class="actions"><button class="btn primary wide" data-act="sheet-save">Сохранить</button>'
    +'<button class="btn wide" data-act="confirm" data-v="close">Закрыть стол</button>'
    +'<button class="btn danger wide" data-act="confirm" data-v="delete">Удалить стол</button></div>';
  h+=confirmBox('close',unserved?'Не вынесено блюд: '+unserved+'. Всё равно закрыть стол?':'Закрыть стол '+esc(t.name)+'?','Закрыть стол');
  h+=confirmBox('delete','Удалить стол вместе с заказом?','Удалить');
  return h;
}
function pickSheet(){
  const d=S.dishes[sheet.key],def=MODDEF[sheet.key];if(!d||!def)return '';
  let h='<div class="sheet-h"><h2>'+esc(d.name)+'</h2>'+closeBtn+'</div>';
  const quick=def.groups.length===1&&!def.tops;
  def.groups.forEach((g,gi)=>{
    h+='<div class="fld"><span>'+esc(g.label)+'</span><div class="chips pk">'
      +g.opts.map((o,oi)=>'<button type="button" class="chip" data-act="pick-opt" data-g="'+gi+'" data-o="'+oi+'" aria-pressed="'+(sheet.sel[gi]===oi)+'">'+esc(o)+'</button>').join('')+'</div></div>';
  });
  if(def.tops){
    h+='<div class="fld"><span>Топпинги</span><div class="chips tp">'
      +TOPS.map((x,i)=>'<button type="button" class="chip" data-act="pick-top" data-i="'+i+'" aria-pressed="'+sheet.tops.includes(x)+'">'+esc(x)+'</button>').join('')+'</div></div>';
  }
  if(!quick){
    const ready=sheet.sel.every(v=>v>=0);
    h+='<div class="actions"><button class="btn primary wide" data-act="pick-add"'+(ready?'':' disabled')+'>'+(ready?'Добавить в заказ':'Выберите '+def.groups.map(g=>g.label.toLowerCase()).join(', '))+'</button></div>';
  }
  return h;
}
function openPick(key){
  const def=MODDEF[key];if(!def)return;
  sheet={type:'pick',key,sel:def.groups.map(()=>-1),tops:[]};
  renderSheet();
}
function pickAdd(){
  const def=MODDEF[sheet.key];
  const mods=def.groups.map((g,gi)=>g.opts[sheet.sel[gi]]);
  const tops=TOPS.filter(x=>sheet.tops.includes(x));
  const k=sheet.key;sheet=null;renderSheet();addDish(k,mods,tops);
}
function itemSheet(){
  const t=getTable(sheet.tableId);
  const seats=Math.max(t.guests,sheet.seat);
  let seatChips=chip('seat','0','На всех',sheet.seat===0);
  for(let s=1;s<=seats;s++)seatChips+=chip('seat',String(s),String(s),sheet.seat===s);
  const isNew=sheet.status==='new';
  let courseChips='';
  for(let c=1;c<=Math.max(MAX_COURSE,sheet.course);c++)courseChips+=chip('course',String(c),'Курс '+c,sheet.course===c);
  let h='<div class="sheet-h"><h2>'+esc(sheet.name)+'</h2>'+closeBtn+'</div>'
    +'<div class="fld"><span>Порций</span>'+stepper('qty',sheet.qty)+'</div>'
    +'<p class="hint">Время готовки по норме: '+cookFor(sheet.name)+' мин</p>'
    +(isNew?modsEdit():'')
    +(isNew?'<div class="fld"><span>Курс</span><div class="chips scroll">'+courseChips+'</div></div>':'')
    +'<div class="fld"><span>Гость</span><div class="chips scroll">'+seatChips+'</div></div>'
    +'<label class="fld"><span>Комментарий</span><input id="f-note" type="text" autocomplete="off" maxlength="120" value="'+esc(sheet.note)+'" placeholder="Без лука, средней прожарки"></label>'
    +'<div class="actions"><button class="btn primary wide" data-act="sheet-save">Готово</button>'
    +'<button class="btn danger wide" data-act="confirm" data-v="delitem">Удалить блюдо</button></div>';
  h+=confirmBox('delitem','Удалить это блюдо из заказа?','Удалить');
  return h;
}
function modsEdit(){
  const def=MODDEF[dishKey(sheet.name)];let h='';
  if(def)def.groups.forEach((g,gi)=>{
    h+='<div class="fld"><span>'+esc(g.label)+'</span><div class="chips">'
      +g.opts.map((o,oi)=>'<button type="button" class="chip" data-act="im-opt" data-g="'+gi+'" data-o="'+oi+'" aria-pressed="'+(sheet.mods[gi]===o)+'">'+esc(o)+'</button>').join('')+'</div></div>';
  });
  if(sheet.zone==='bar'){
    h+='<div class="fld"><span>Топпинги</span><div class="chips tp">'
      +TOPS.map((x,i)=>'<button type="button" class="chip" data-act="im-top" data-i="'+i+'" aria-pressed="'+sheet.tops.includes(x)+'">'+esc(x)+'</button>').join('')+'</div></div>';
  }
  return h;
}
function courseSheet(){
  const t=getTable(sheet.tableId);const i=t&&t.items.find(x=>x.id===sheet.id);
  if(!i)return '';
  let chips='';
  for(let c=1;c<=Math.max(MAX_COURSE,i.course);c++)chips+='<button type="button" class="chip" data-act="set-course" data-c="'+c+'" aria-pressed="'+(c===i.course)+'">'+c+'</button>';
  return '<div class="sheet-h"><h2>В какой курс?</h2>'+closeBtn+'</div><p class="hint">'+esc(i.name)+'</p><div class="chips big">'+chips+'</div>';
}
function guideSheet(){
  return '<div class="sheet-h"><h2>Как пользоваться</h2>'+closeBtn+'</div>'
    +'<ol class="guide">'
    +'<li><b>Стол.</b> Нажмите на свободный стол и выберите число гостей.</li>'
    +'<li><b>Гости.</b> Заказ разбит по гостям. Нажмите на гостя («Гость 1», «На всех»): блюда из меню будут добавляться ему. Гостя блюда можно сменить в карточке блюда.</li>'
    +'<li><b>Заказ.</b> Внизу «Меню»: поиск или цех, категория, блюдо. Нажатие на блюдо добавляет его в заказ. Кнопка «Курс» рядом с поиском выбирает курс для новых блюд.</li>'
    +'<li><b>Выбор.</b> У чая и согревающих напитков спросит объём и топпинги, у какао зефир, у коктейля вкус, у ухи подачу. Всё это меняется в карточке блюда.</li>'
    +'<li><b>Правка.</b> Нажмите на блюдо: порции, гость, комментарий. Смахните блюдо вправо, чтобы сразу написать комментарий. Метка «Курс» на блюде меняет курс.</li>'
    +'<li><b>Готовка.</b> «Отправить» запускает таймер, «Вынесено» останавливает его.</li>'
    +'<li><b>Курсы.</b> Первый курс вы отправляете сами. Дальше каждый цех сам запускает свой следующий курс, когда вынес предыдущий. Другие цеха не трогаются.</li>'
    +'<li><b>Стол.</b> Кнопка с тремя точками: пересадить, закрыть, удалить. Блюдо или стол смахните влево, чтобы удалить.</li>'
    +'<li><b>Сигнал.</b> Колокольчик включает звук и вибрацию, когда время готовки вышло. Солнце не даёт экрану гаснуть.</li>'
    +'</ol>';
}
function commentSheet(){
  const t=getTable(sheet.tableId);const i=t&&t.items.find(x=>x.id===sheet.id);
  if(!i)return '';
  return '<div class="sheet-h"><h2>Комментарий</h2>'+closeBtn+'</div><p class="hint">'+esc(i.name)+'</p>'
    +'<label class="fld"><input id="f-cm" type="text" autocomplete="off" maxlength="120" value="'+esc(sheet.note)+'" placeholder="Без лука, средней прожарки"></label>'
    +'<div class="actions"><button class="btn primary wide" data-act="comment-save">Готово</button>'
    +(i.note?'<button class="btn wide" data-act="comment-clear">Убрать комментарий</button>':'')+'</div>';
}
function pcourseSheet(){
  const t=getTable(route.id);const cur=(t&&t.course)||1;
  let chips='';
  for(let c=1;c<=Math.max(MAX_COURSE,cur);c++)chips+='<button type="button" class="chip" data-act="set-pcourse" data-c="'+c+'" aria-pressed="'+(c===cur)+'">'+c+'</button>';
  return '<div class="sheet-h"><h2>Добавлять в курс</h2>'+closeBtn+'</div><p class="hint">Новые блюда из меню попадут в выбранный курс.</p><div class="chips big">'+chips+'</div>';
}
function renderSheet(){
  const el=$('#sheet');
  if(!sheet){el.hidden=true;el.innerHTML='';return;}
  const old=el.querySelector('.sheet');const top=old?old.scrollTop:0;
  el.hidden=false;
  const inner=sheet.type==='seat'?seatSheet():sheet.type==='table'?tableSheet():sheet.type==='course'?courseSheet():sheet.type==='guide'?guideSheet():sheet.type==='comment'?commentSheet():sheet.type==='pcourse'?pcourseSheet():sheet.type==='pick'?pickSheet():itemSheet();
  el.innerHTML='<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>';
  const nw=el.querySelector('.sheet');if(nw&&top)nw.scrollTop=top;
}
function syncSheet(){
  if(!sheet)return;
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  if(sheet.type==='table'){const v=g('f-tnote');if(v!==null)sheet.note=v;}
  else if(sheet.type==='item'){const v=g('f-note');if(v!==null)sheet.note=v;}
  else if(sheet.type==='comment'){const v=g('f-cm');if(v!==null)sheet.note=v;}
}
function openComment(id){
  const t=getTable(route.id);const i=t&&t.items.find(x=>x.id===id);if(!i)return;
  sheet={type:'comment',id:i.id,tableId:t.id,note:i.note||''};
  renderSheet();
  const el=$('#f-cm');
  if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}}
}
function saveComment(clear){
  syncSheet();
  const t=getTable(sheet.tableId);const i=t&&t.items.find(x=>x.id===sheet.id);
  if(i){i.note=clear?'':sheet.note.trim();save();}
  sheet=null;renderSheet();refresh();
}
function openItemSheet(i){
  const t=getTable(route.id);
  const def=MODDEF[dishKey(i.name)];
  sheet={type:'item',id:i.id,tableId:t.id,name:i.name,zone:i.zone,status:i.status,qty:i.qty,seat:i.seat,course:i.course,cook:i.cook,note:i.note||'',confirm:'',
    mods:def?def.groups.map((g,gi)=>(i.mods||[])[gi]||''):[],tops:(i.tops||[]).slice()};
  renderSheet();
}

/* ---------- действия ---------- */
function openSlot(n,g){
  if(slotTable(n)){toast('Стол '+n+' уже занят');sheet=null;renderSheet();renderApp();return;}
  const t={id:uid(),name:String(n),guests:g,note:'',openedAt:Date.now(),closedAt:null,course:1,seat:1,items:[]};
  S.tables.push(t);save();
  sheet=null;renderSheet();go('t-'+t.id);
}
function saveTable(){
  syncSheet();
  const t=getTable(sheet.id);if(!t)return;
  t.guests=sheet.guests;t.note=sheet.note.trim();
  save();sheet=null;renderSheet();
  refresh();
}
function saveItem(){
  syncSheet();
  const t=getTable(sheet.tableId);const i=t&&t.items.find(x=>x.id===sheet.id);
  if(!i){sheet=null;renderSheet();return;}
  i.qty=sheet.qty;i.seat=sheet.seat;i.note=sheet.note.trim();
  if(i.status==='new'){
    i.course=sheet.course;
    i.mods=sheet.mods.filter(Boolean);
    i.tops=TOPS.filter(x=>sheet.tops.includes(x));
  }
  save();sheet=null;renderSheet();refresh();
}
function sendToKitchen(i,now){i.status='kitchen';i.sentAt=now;i.servedAt=null;i.alerted=false;i.cook=cookFor(i.name);}
function markServed(i,now){i.status='served';i.servedAt=now;}
function advance(id){
  const t=getTable(route.id);if(!t)return;
  const i=t.items.find(x=>x.id===id);if(!i)return;
  const now=Date.now();
  let res=[];
  if(i.status==='new')sendToKitchen(i,now);
  else if(i.status==='kitchen'){markServed(i,now);res.push(chainAfter(t,i.course,i.zone,now));}
  else{i.status=i.sentAt?'kitchen':'new';i.servedAt=null;i.alerted=i.sentAt?(now-i.sentAt>=i.cook*60000):false;}
  save();refresh();
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
  chainToast(res);
}
function courseAct(course,from){
  const t=getTable(route.id);if(!t)return;
  const now=Date.now();
  const zones=new Set();
  t.items.forEach(i=>{
    if(i.course!==course||i.status!==from)return;
    if(from==='new')sendToKitchen(i,now);else{markServed(i,now);zones.add(i.zone);}
  });
  const res=[];
  zones.forEach(z=>res.push(chainAfter(t,course,z,now)));
  save();refresh();
  chainToast(res);
}
function delTable(id){
  const idx=S.tables.findIndex(t=>t.id===id);if(idx<0)return;
  const t=S.tables[idx];
  S.tables.splice(idx,1);save();refresh();
  toast('Стол '+t.name+' удалён',4000,'Вернуть',()=>{
    if(!t.closedAt&&slotTable(+t.name)){toast('Стол '+t.name+' уже занят');return;}
    S.tables.splice(Math.min(idx,S.tables.length),0,t);save();refresh();
  });
}
function delItem(tableId,id){
  const t=getTable(tableId);if(!t)return;
  const idx=t.items.findIndex(x=>x.id===id);if(idx<0)return;
  const it=t.items[idx];
  t.items.splice(idx,1);save();refresh();
  toast('Удалено: '+it.name,4000,'Вернуть',()=>{
    const tt=getTable(tableId);if(!tt)return;
    tt.items.splice(Math.min(idx,tt.items.length),0,it);save();refresh();
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  unlockAudio();
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case 'open':go('t-'+id);break;
    case 'back':go('');break;
    case 'go':go(b.dataset.h);break;
    case 'guide':sheet={type:'guide'};renderSheet();break;
    case 'free-table':sheet={type:'seat',slot:+b.dataset.n};renderSheet();break;
    case 'open-slot':openSlot(+b.dataset.n,+b.dataset.g);break;
    case 'table-menu':{const t=getTable(route.id);if(t){sheet={type:'table',id:t.id,guests:t.guests,note:t.note||'',confirm:''};renderSheet();}break;}
    case 'edit-item':{const t=getTable(route.id);const i=t&&t.items.find(x=>x.id===id);if(i)openItemSheet(i);break;}
    case 'pick-course':{const t=getTable(route.id);if(t){sheet={type:'course',id:id,tableId:t.id};renderSheet();}break;}
    case 'set-course':{
      const t=getTable(sheet.tableId);const i=t&&t.items.find(x=>x.id===sheet.id);
      if(i&&i.status==='new'){i.course=+b.dataset.c;save();}
      sheet=null;renderSheet();refresh();break;
    }
    case 'swipe-comment':openComment(id);break;
    case 'comment-save':if(sheet&&sheet.type==='comment')saveComment(false);break;
    case 'comment-clear':if(sheet&&sheet.type==='comment')saveComment(true);break;
    case 'advance':advance(id);break;
    case 'course-send':courseAct(+b.dataset.course,'new');break;
    case 'course-serve':courseAct(+b.dataset.course,'kitchen');break;
    case 'swipe-del':if(b.dataset.kind==='table')delTable(id);else delItem(route.id,id);break;
    case 'tog-sound':S.settings.sound=!S.settings.sound;save();renderApp();toast(S.settings.sound?'Звук включён':'Звук выключен');break;
    case 'tog-wake':toggleWake();break;
    case 'mp-toggle':setMp(!ui.open);break;
    case 'mp-zone':ui.zone=b.dataset.z;ui.cat=null;renderMpBody();{const sc=$('#mp-scroll');if(sc)sc.scrollTop=0;}break;
    case 'pick-cat':ui.cat=+b.dataset.i;renderMpBody();{const sc=$('#mp-scroll');if(sc)sc.scrollTop=0;}break;
    case 'mp-back':ui.cat=null;renderMpBody();break;
    case 'mp-course-pick':sheet={type:'pcourse'};renderSheet();break;
    case 'set-pcourse':{const t=getTable(route.id);if(t){t.course=+b.dataset.c;save();}sheet=null;renderSheet();renderMpBody();break;}
    case 'mp-clear':{ui.q='';const q=$('#mp-q');if(q){q.value='';q.focus();}b.hidden=true;renderMpBody();break;}
    case 'add-dish':{const k=b.dataset.k;if(MODDEF[k])openPick(k);else addDish(k);break;}
    case 'set-seat':{const t=getTable(route.id);if(t){t.seat=+b.dataset.s;save();refreshOrder();}break;}
    case 'pick-opt':{
      if(!sheet||sheet.type!=='pick')break;
      const def=MODDEF[sheet.key];sheet.sel[+b.dataset.g]=+b.dataset.o;
      if(def.groups.length===1&&!def.tops)pickAdd();else renderSheet();
      break;
    }
    case 'pick-top':{if(!sheet||sheet.type!=='pick')break;const x=TOPS[+b.dataset.i],k=sheet.tops.indexOf(x);if(k>=0)sheet.tops.splice(k,1);else sheet.tops.push(x);renderSheet();break;}
    case 'pick-add':if(sheet&&sheet.type==='pick'&&sheet.sel.every(v=>v>=0))pickAdd();break;
    case 'im-opt':{syncSheet();const def=MODDEF[dishKey(sheet.name)];sheet.mods[+b.dataset.g]=def.groups[+b.dataset.g].opts[+b.dataset.o];renderSheet();break;}
    case 'im-top':{syncSheet();const x=TOPS[+b.dataset.i],k=sheet.tops.indexOf(x);if(k>=0)sheet.tops.splice(k,1);else sheet.tops.push(x);renderSheet();break;}
    case 'sheet-close':sheet=null;renderSheet();break;
    case 'sheet-save':if(sheet)(sheet.type==='table'?saveTable():saveItem());break;
    case 'step':{
      syncSheet();
      const f=b.dataset.f,d=+b.dataset.d;
      const lim={guests:[1,30],qty:[1,99],cook:[1,180]}[f];
      sheet[f]=Math.min(lim[1],Math.max(lim[0],sheet[f]+d));
      renderSheet();break;
    }
    case 'chip':syncSheet();sheet[b.dataset.f]=+b.dataset.v;renderSheet();break;
    case 'move-table':{
      const t=getTable(sheet.id),n=+b.dataset.n;
      if(!t)break;
      if(slotTable(n)){toast('Стол '+n+' уже занят');break;}
      const old=t.name;t.name=String(n);save();
      sheet=null;renderSheet();refresh();
      if(route.v==='table'){const h=$('.h1n');if(h)h.textContent=t.name;}
      toast('Стол '+old+' пересажен на '+n);break;
    }
    case 'confirm':syncSheet();sheet.confirm=b.dataset.v;renderSheet();break;
    case 'close-yes':{
      const t=getTable(sheet.id);t.closedAt=Date.now();save();
      sheet=null;renderSheet();toast('Стол '+t.name+' закрыт');go('');break;
    }
    case 'delete-yes':{
      const sid=sheet.id;sheet=null;renderSheet();go('');delTable(sid);break;
    }
    case 'delitem-yes':{
      const tid=sheet.tableId,iid=sheet.id;sheet=null;renderSheet();delItem(tid,iid);break;
    }
    case 'reopen':{
      const t=getTable(id);
      if(t){
        if(slotTable(+t.name)){toast('Стол '+t.name+' сейчас занят');break;}
        t.closedAt=null;save();toast('Стол '+t.name+' снова в зале');renderApp();
      }
      break;
    }
    case 'clear-ask':confirmClear=true;renderApp();break;
    case 'clear-no':confirmClear=false;renderApp();break;
    case 'clear-yes':S.tables=S.tables.filter(t=>!t.closedAt);confirmClear=false;save();renderApp();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='mp-q'){
    ui.q=e.target.value;
    const c=$('.sclear');if(c)c.hidden=!ui.q;
    renderMpBody();
    const sc=$('#mp-scroll');if(sc)sc.scrollTop=0;
  }
});
document.addEventListener('focusin',e=>{
  if(e.target.id==='mp-q'&&!ui.open){ui.open=true;applyMp();}
});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='mp-q'&&e.key==='Enter'){e.preventDefault();e.target.blur();return;}
  if(sheet){
    if(e.key==='Escape'){sheet=null;renderSheet();return;}
    if(e.key==='Enter'&&e.target&&e.target.tagName==='INPUT'){
      e.preventDefault();
      if(sheet.type==='table')saveTable();else if(sheet.type==='item')saveItem();else if(sheet.type==='comment')saveComment(false);
    }
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){
    e.preventDefault();e.target.click();
  }
});
/* клавиатура: панель меню поднимается над ней */
(function(){
  const vv=window.visualViewport;if(!vv)return;
  const set=()=>{
    const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    const r=document.documentElement;
    r.style.setProperty('--kb',kb+'px');
    r.style.setProperty('--vvh',vv.height+'px');
    r.classList.toggle('kb',kb>60);
  };
  vv.addEventListener('resize',set);vv.addEventListener('scroll',set);set();
})();

/* прокрутка панели меню и листов не должна «протекать» на заказ под ними */
let tsx=0,tsy=0;
document.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){tsx=t.clientX;tsy=t.clientY;}},{passive:true});
document.addEventListener('touchmove',e=>{
  const tg=e.target;
  if(!tg||!tg.closest||!tg.closest('.mp,.sheet,.backdrop'))return;
  const t=e.touches[0];if(!t)return;
  const dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)>Math.abs(dy)&&tg.closest('.mp-course,.chips.scroll'))return;
  const sc=tg.closest('.mp-scroll,.sheet');
  if(sc){
    const top=sc.scrollTop<=0,bot=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1;
    if((dy>0&&top)||(dy<0&&bot))e.preventDefault();
    return;
  }
  e.preventDefault();
},{passive:false});

/* ---------- смахивание ---------- */
let sw=null,swallow=false,swTimer=null;
function closeSwipes(except){
  document.querySelectorAll('.sw.open').forEach(w=>{
    if(except&&w===except)return;
    w.classList.remove('open');
    const fg=w.querySelector('.sw-fg');
    if(fg){fg.style.transition='';fg.style.transform='';}
    setTimeout(()=>w.classList.remove('drag'),220);
  });
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.sw-del')){sw=null;return;}
  const fg=e.target.closest('.sw-fg');
  closeSwipes(fg?fg.parentElement:null);
  if(!fg||(e.pointerType==='mouse'&&e.button!==0)){sw=null;return;}
  const wrap=fg.parentElement;
  sw={wrap,fg,x0:e.clientX,y0:e.clientY,base:wrap.classList.contains('open')?-SW_W:0,x:0,mode:null,id:e.pointerId,hasCm:!!wrap.querySelector('.sw-cm')};
});
document.addEventListener('pointermove',e=>{
  if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(sw.mode===null){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.3){sw.mode='h';sw.wrap.classList.add('drag');sw.fg.style.transition='none';}
    else if(Math.abs(dy)>8){sw=null;return;}
    else return;
  }
  sw.x=Math.max(-SW_W-20,Math.min(sw.hasCm?SW_W+20:0,sw.base+dx));
  sw.fg.style.transform='translateX('+sw.x+'px)';
});
function endSwipe(e){
  if(!sw||e.pointerId!==sw.id)return;
  const s=sw;sw=null;
  s.fg.style.transition='';
  if(s.mode==='h'){
    const open=s.x<-SW_W*0.45;const wantCm=s.hasCm&&s.x>SW_W*0.8;
    s.fg.style.transform=open?'translateX(-'+SW_W+'px)':'';
    s.wrap.classList.toggle('open',open);
    if(!open)setTimeout(()=>s.wrap.classList.remove('drag'),220);
    swallow=true;clearTimeout(swTimer);swTimer=setTimeout(()=>{swallow=false;},350);
    if(wantCm)openComment(s.wrap.dataset.iid);
  }else if(e.type==='pointerup'&&s.wrap.classList.contains('open')){
    closeSwipes(null);
    swallow=true;clearTimeout(swTimer);swTimer=setTimeout(()=>{swallow=false;},350);
  }
}
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',endSwipe);
document.addEventListener('click',e=>{
  if(swallow){e.stopPropagation();e.preventDefault();swallow=false;}
},true);

/* ---------- звук, экран, плашки ---------- */
let ac=null;
function unlockAudio(){
  try{
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}
    if(ac&&ac.state==='suspended')ac.resume();
  }catch(e){}
}
document.addEventListener('pointerdown',unlockAudio);
function beep(){
  try{
    if(!ac)return;
    const t=ac.currentTime;
    [0,0.24].forEach((d,k)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=k?1175:880;
      g.gain.setValueAtTime(0.0001,t+d);
      g.gain.exponentialRampToValueAtTime(0.3,t+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.2);
      o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+0.22);
    });
  }catch(e){}
}
let wl=null;
async function setWake(on){
  try{
    if(on){
      if(!('wakeLock' in navigator))return false;
      wl=await navigator.wakeLock.request('screen');
      wl.addEventListener('release',()=>{wl=null;});
      return true;
    }
    if(wl){await wl.release();wl=null;}
    return true;
  }catch(e){wl=null;return false;}
}
async function toggleWake(){
  const want=!S.settings.wake;
  if(want){
    if(!('wakeLock' in navigator)){toast('Этот браузер не умеет держать экран включённым');return;}
    const ok=await setWake(true);
    if(!ok){toast('Не удалось удержать экран включённым');return;}
  }else await setWake(false);
  S.settings.wake=want;save();renderApp();
  toast(want?'Экран не будет гаснуть, пока страница открыта':'Экран гаснет как обычно');
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S.settings.wake&&!wl)setWake(true);
});
let tt=null;
function toast(m,ms,actLabel,actFn){
  const el=$('#toast');
  el.textContent='';
  const s=document.createElement('span');s.textContent=m;el.appendChild(s);
  if(actLabel){
    const b=document.createElement('button');
    b.type='button';b.className='toast-act';b.textContent=actLabel;
    b.addEventListener('click',ev=>{ev.stopPropagation();el.classList.remove('on');clearTimeout(tt);actFn();});
    el.appendChild(b);
  }
  el.classList.add('on');
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),ms||1800);
}
$('#toast').addEventListener('click',()=>{$('#toast').classList.remove('on');clearTimeout(tt);});

/* ---------- таймеры ---------- */
function checkAlerts(now){
  const msgs=[];
  S.tables.forEach(t=>{
    if(t.closedAt)return;
    t.items.forEach(i=>{
      if(i.status==='kitchen'&&!i.alerted&&now-i.sentAt>=i.cook*60000){i.alerted=true;msgs.push('Стол '+t.name+': '+i.name);}
    });
  });
  if(!msgs.length)return;
  save();
  if(S.settings.sound)beep();
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
  toast(msgs.slice(0,2).join(' · ')+(msgs.length>2?' и ещё '+(msgs.length-2):'')+': пора забирать',3500);
}
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(el=>{
    const ms=Math.max(0,now-(+el.dataset.since));
    const tgt=(+el.dataset.target||0)*60000;
    const r=tgt?ms/tgt:0;
    el.dataset.state=r>=1?'late':r>=0.8?'warn':'ok';
    const f=el.dataset.fmt;
    if(f==='bar')el.style.width=Math.min(100,r*100)+'%';
    else if(f!=='state')el.textContent=fmtClock(ms);
  });
  document.querySelectorAll('[data-seated]').forEach(el=>{el.textContent=fmtSeated(now-(+el.dataset.seated));});
  checkAlerts(now);
}

renderApp();
setInterval(tick,1000);
if(S.settings.wake)setWake(true);
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
